name: Bug report
description: Report a reproducible problem with DSH Desk
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, search existing issues for duplicates. Please keep credentials, prompts, and other private data out of screenshots and logs.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of steps.
      placeholder: |
        1. Start DSH Desk...
        2. Open...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Attach screenshots, recordings, or redacted logs when useful. Do not include credentials or private prompts.
      render: text

  - type: input
    id: desk-version
    attributes:
      label: DSH Desk version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: e.g. 0.1.1-rc.2
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other or unknown
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Windows installer (.exe)
        - Portable ZIP
        - Source checkout (npm run start)
        - Other
    validations:
      required: true
